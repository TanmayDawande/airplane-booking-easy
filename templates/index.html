<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyDesk – Airline Reservation</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#14213d;--muted:#6b7a90;--line:#e1e7ef;--accent:#1d4ed8;--accent-soft:#e8efff;--ok:#0f766e;--bad:#b91c1c}
*{box-sizing:border-box;margin:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:var(--ink);color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
header h1{font-size:1.25rem;font-weight:800;letter-spacing:.3px}
nav{display:flex;gap:4px}
nav button{background:none;border:0;color:#b9c4d8;font:inherit;font-weight:600;padding:8px 16px;border-radius:8px;cursor:pointer;transition:.15s}
nav button.on,nav button:hover{background:#fff;color:var(--ink)}
main{max-width:920px;margin:28px auto;padding:0 16px}
section{display:none}section.on{display:block}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px}
h2{font-size:1.05rem;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);font-weight:600;gap:4px;flex:1;min-width:130px}
input{font:inherit;color:var(--ink);padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
input:focus{outline:2px solid var(--accent);border-color:transparent}
.btn{font:inherit;font-weight:600;padding:9px 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:#fde8e8;color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:.85rem}
.flight{display:flex;align-items:center;gap:16px;padding:16px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.flight:first-of-type{border-top:0}
.route{flex:1;min-width:220px}
.route b{font-size:1.1rem}
.route small,.meta{color:var(--muted);font-size:.85rem}
.price{font-weight:800;font-size:1.15rem}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:#d9f3ef;color:var(--ok)}.tag.bad{background:#fde8e8;color:var(--bad)}
.empty{color:var(--muted);text-align:center;padding:24px 0}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:.82rem}
tfoot td{font-weight:800;border-bottom:0}
dialog{border:0;border-radius:14px;padding:24px;width:min(420px,92vw);box-shadow:0 20px 60px rgba(20,33,61,.3);margin:auto}
dialog::backdrop{background:rgba(20,33,61,.5)}
dialog form{display:flex;flex-direction:column;gap:12px}
dialog .row{justify-content:flex-end;margin-top:6px}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{background:var(--bad)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>SkyDesk</h1>
  <nav>
    <button data-tab="flights" class="on">Flights</button>
    <button data-tab="bookings">My bookings</button>
    <button data-tab="admin">Admin</button>
  </nav>
</header>

<main>
  <!-- FLIGHTS -->
  <section id="flights" class="on">
    <div class="panel">
      <h2>Find a flight</h2>
      <div class="row">
        <label>From<input id="f-origin" placeholder="Chennai"></label>
        <label>To<input id="f-dest" placeholder="Delhi"></label>
        <label>Date<input id="f-date" type="date"></label>
        <button class="btn" onclick="loadFlights()">Search</button>
      </div>
    </div>
    <div class="panel" id="flight-list"></div>
  </section>

  <!-- MY BOOKINGS -->
  <section id="bookings">
    <div class="panel">
      <h2>Find your bookings</h2>
      <div class="row">
        <label>Email used while booking<input id="b-email" type="email" placeholder="you@example.com"></label>
        <button class="btn" onclick="loadBookings()">Show bookings</button>
      </div>
    </div>
    <div class="panel" id="booking-list"><p class="empty">Enter your email to see your bookings.</p></div>
  </section>

  <!-- ADMIN -->
  <section id="admin">
    <div class="panel">
      <h2>Add a flight</h2>
      <div class="row">
        <label>Flight no.<input id="a-no" placeholder="AI777"></label>
        <label>From<input id="a-origin"></label>
        <label>To<input id="a-dest"></label>
      </div>
      <div class="row" style="margin-top:10px">
        <label>Departure<input id="a-dep" type="datetime-local"></label>
        <label>Price (₹)<input id="a-price" type="number" min="1"></label>
        <label>Seats<input id="a-seats" type="number" min="1"></label>
        <button class="btn" onclick="addFlight()">Add flight</button>
      </div>
    </div>
    <div class="panel"><h2>Manage flights</h2><div id="admin-flights"></div></div>
    <div class="panel"><h2>Sales report</h2><div id="report"></div></div>
  </section>
</main>

<!-- Booking dialog -->
<dialog id="book-dlg">
  <form onsubmit="submitBooking(event)">
    <h2 id="book-title"></h2>
    <label>Full name<input id="p-name" required></label>
    <label>Email<input id="p-email" type="email" required></label>
    <label>Phone (10 digits)<input id="p-phone" required></label>
    <div class="row">
      <button type="button" class="btn ghost" onclick="book_dlg.close()">Close</button>
      <button class="btn">Confirm booking</button>
    </div>
  </form>
</dialog>

<!-- Edit passenger dialog -->
<dialog id="edit-dlg">
  <form onsubmit="submitEdit(event)">
    <h2>Edit passenger details</h2>
    <label>Full name<input id="e-name" required></label>
    <label>Phone (10 digits)<input id="e-phone" required></label>
    <div class="row">
      <button type="button" class="btn ghost" onclick="edit_dlg.close()">Close</button>
      <button class="btn">Save changes</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const book_dlg = $("book-dlg"), edit_dlg = $("edit-dlg");
let flightId = null, editId = null;

// helper: call the Flask API and return JSON
async function api(url, method = "GET", body) {
  const res = await fetch(url, {method, headers: {"Content-Type": "application/json"}, body: body && JSON.stringify(body)});
  const data = await res.json();
  if (!res.ok) { toast(data.error || "Something went wrong", true); throw new Error(data.error); }
  return data;
}
function toast(msg, err) {
  const t = $("toast"); t.textContent = msg; t.className = "show" + (err ? " err" : "");
  setTimeout(() => t.className = "", 2800);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = d => new Date(d.replace(" ", "T")).toLocaleString("en-IN", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
const inr = n => "₹" + Number(n).toLocaleString("en-IN");

// tabs
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button, section").forEach(e => e.classList.remove("on"));
  b.classList.add("on"); $(b.dataset.tab).classList.add("on");
  if (b.dataset.tab === "admin") loadAdmin();
});

// ----- flights -----
async function loadFlights() {
  const q = new URLSearchParams({origin: $("f-origin").value, destination: $("f-dest").value, date: $("f-date").value});
  const list = await api("/api/flights?" + q);
  $("flight-list").innerHTML = list.length ? list.map(f => `
    <div class="flight">
      <div class="route"><b>${esc(f.origin)} → ${esc(f.destination)}</b><br>
        <small>${esc(f.flight_no)} · ${fmt(f.departure)}</small></div>
      <span class="tag ${f.available ? "ok" : "bad"}">${f.available ? f.available + " seats left" : "Full"}</span>
      <span class="price">${inr(f.price)}</span>
      <button class="btn sm" ${f.available ? "" : "disabled"} onclick="openBook(${f.flight_id}, '${esc(f.flight_no)} · ${esc(f.origin)} → ${esc(f.destination)}')">Book</button>
    </div>`).join("") : `<p class="empty">No flights match your search.</p>`;
}
function openBook(id, title) {
  flightId = id; $("book-title").textContent = title; book_dlg.showModal();
}
async function submitBooking(e) {
  e.preventDefault();
  try {
    const r = await api("/api/book", "POST", {flight_id: flightId, name: $("p-name").value, email: $("p-email").value, phone: $("p-phone").value});
    book_dlg.close(); toast(`Booked! Booking #${r.booking_id}, seat ${r.seat_no}`);
    $("b-email").value = $("p-email").value; loadFlights();
  } catch {}
}

// ----- my bookings -----
async function loadBookings() {
  const list = await api("/api/bookings?email=" + encodeURIComponent($("b-email").value));
  $("booking-list").innerHTML = list.length ? list.map(b => `
    <div class="flight">
      <div class="route"><b>${esc(b.origin)} → ${esc(b.destination)}</b><br>
        <small>${esc(b.flight_no)} · ${fmt(b.departure)} · Seat ${b.seat_no ?? "–"} · Booking #${b.booking_id}</small><br>
        <small>${esc(b.name)} · ${esc(b.phone)}</small></div>
      <span class="tag ${b.status === "CONFIRMED" ? "ok" : "bad"}">${b.status === "CONFIRMED" ? "Confirmed" : "Cancelled"}</span>
      <span class="price">${inr(b.price)}</span>
      <button class="btn ghost sm" onclick="openEdit(${b.passenger_id}, '${esc(b.name)}', '${esc(b.phone)}')">Edit</button>
      ${b.status === "CONFIRMED" ? `<button class="btn danger sm" onclick="cancelBooking(${b.booking_id})">Cancel</button>` : ""}
    </div>`).join("") : `<p class="empty">No bookings found for this email.</p>`;
}
async function cancelBooking(id) {
  if (!confirm("Cancel this booking?")) return;
  await api("/api/bookings/" + id, "DELETE"); toast("Booking cancelled"); loadBookings();
}
function openEdit(id, name, phone) {
  editId = id; $("e-name").value = name; $("e-phone").value = phone; edit_dlg.showModal();
}
async function submitEdit(e) {
  e.preventDefault();
  try {
    await api("/api/passengers/" + editId, "PUT", {name: $("e-name").value, phone: $("e-phone").value});
    edit_dlg.close(); toast("Details updated"); loadBookings();
  } catch {}
}

// ----- admin -----
async function addFlight() {
  try {
    await api("/api/flights", "POST", {flight_no: $("a-no").value, origin: $("a-origin").value, destination: $("a-dest").value,
      departure: $("a-dep").value, price: $("a-price").value, total_seats: $("a-seats").value});
    toast("Flight added");
    ["a-no","a-origin","a-dest","a-dep","a-price","a-seats"].forEach(i => $(i).value = "");
    loadAdmin();
  } catch {}
}
async function removeFlight(id) {
  if (!confirm("Delete this flight?")) return;
  try { await api("/api/flights/" + id, "DELETE"); toast("Flight deleted"); loadAdmin(); } catch {}
}
async function loadAdmin() {
  const [flights, report] = await Promise.all([api("/api/flights"), api("/api/report")]);
  $("admin-flights").innerHTML = `<table><tr><th>Flight</th><th>Route</th><th>Departure</th><th>Price</th><th></th></tr>` +
    flights.map(f => `<tr><td>${esc(f.flight_no)}</td><td>${esc(f.origin)} → ${esc(f.destination)}</td><td>${fmt(f.departure)}</td>
      <td>${inr(f.price)}</td><td><button class="btn danger sm" onclick="removeFlight(${f.flight_id})">Delete</button></td></tr>`).join("") + `</table>`;
  const tb = report.reduce((s, r) => s + r.bookings, 0), tr = report.reduce((s, r) => s + r.revenue, 0);
  $("report").innerHTML = `<table><tr><th>Flight</th><th>Route</th><th>Seats filled</th><th>Revenue</th></tr>` +
    report.map(r => `<tr><td>${esc(r.flight_no)}</td><td>${esc(r.origin)} → ${esc(r.destination)}</td>
      <td>${r.bookings} / ${r.total_seats}</td><td>${inr(r.revenue)}</td></tr>`).join("") +
    `<tfoot><tr><td colspan="2">Total</td><td>${tb}</td><td>${inr(tr)}</td></tr></tfoot></table>`;
}

loadFlights();
</script>
</body>
</html>
